name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile=false
      # Exclude template/example packages whose routeTree.gen is only written
      # by `tsr watch` during dev and not committed. They are private, not
      # published, and already marked `ignore` in the Changesets release
      # pipeline; extending the intent to CI keeps unrelated PRs green.
      - run: pnpm turbo run build typecheck test --filter=...[origin/main] --filter=!@asteby/metacore-starter-vite --filter=!@asteby/metacore-fullstack-example

  # Gate de codegen (MD0.6): los tipos TS de packages/sdk/src/generated salen de
  # los structs Go del kernel fijado en go.mod via tygo. Si alguien sube el
  # kernel (o cambia tygo.yaml) sin regenerar, este job falla con el diff.
  codegen:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Regenerar tipos TS desde el kernel
        run: |
          go run github.com/gzuidhof/tygo@v0.2.17 generate
          node scripts/codegen-post.mjs
      - name: Fallar si hay diff (corre `pnpm codegen` y commitea)
        run: |
          git status --short packages/sdk/src/generated
          git diff --exit-code -- packages/sdk/src/generated

  # Gate de codegen de genui/v2 (ADR 0001 del SDK, §2.7): los tipos TS y las
  # tablas por bloque salen de packages/genui/schema/genui-v2.schema.json.
  genui-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Regenerar tipos de genui/v2
        run: pnpm --filter @asteby/metacore-genui codegen
      - name: Fallar si hay diff (corre `pnpm --filter @asteby/metacore-genui codegen` y commitea)
        run: |
          git status --short packages/genui
          git diff --exit-code -- packages/genui/src/generated

  # The fullstack starter is excluded from the node job above, so nothing else
  # notices when the kernel API moves under it: it sat on kernel v0.5.0 and
  # Fiber v2 long after the kernel went to Fiber v3. Building it here keeps the
  # scaffold `npm create @asteby/metacore-app -- --example fullstack-starter`
  # compiling against the kernel it pins.
  starter-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/fullstack-starter/backend
    env:
      # Standalone module: ignore any go.work and build against the pinned kernel.
      GOWORK: 'off'
      # metacore-kernel's runtime/wasm uses pg_query_go, which needs cgo.
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/fullstack-starter/backend/go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
