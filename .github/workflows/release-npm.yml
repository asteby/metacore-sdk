name: Release npm packages

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      # `npm stage` (publicar a staging) no existe en el npm que trae Node 22
      # (EUNKNOWNCOMMAND). Se fija una version con el subcomando y se comprueba
      # aqui, para que un cambio de npm falle ruidoso antes de preparar nada.
      - name: Usar npm con soporte de `npm stage`
        run: |
          npm install -g npm@11.19.0
          npm --version
          npm stage --help > /dev/null
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter "./packages/*" -r build
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # Prepara en staging de npm (un humano aprueba con 2FA); ver docs/PUBLISHING.md
          publish: node scripts/publish-staged.mjs
          version: pnpm run version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
