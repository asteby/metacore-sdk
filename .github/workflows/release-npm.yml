name: Release npm packages

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      # Publicacion por Trusted Publishing (OIDC): sin token ni aprobacion manual.
      # Requiere npm >= 11.5.1 (el de Node 22 es mas viejo) y que cada paquete tenga
      # configurado `npm trust github <pkg> --file release-npm.yml --repo asteby/metacore-sdk --allow-publish`.
      - name: Usar un npm con soporte de OIDC
        run: |
          npm install -g npm@11.19.0
          npm --version
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter "./packages/*" -r build
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # Publica directo por OIDC (Trusted Publishing); ver docs/PUBLISHING.md
          publish: pnpm exec changeset publish
          version: pnpm run version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
