name: Release npm packages

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      # OIDC (Trusted Publishing) y `npm stage` piden npm >= 11.5; Node 22 trae npm 10.
      - name: npm 11 (npm stage)
        run: npm install -g npm@11 && npm --version
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter "./packages/*" -r build
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # Intenta publicar directo por Trusted Publishing (OIDC) y, si npm exige
          # staging, prepara con `npm stage publish`; ver docs/PUBLISHING.md
          publish: node scripts/publish-staged.mjs
          version: pnpm run version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Solo para el fallback de staging. Deliberadamente NO se llama
          # NODE_AUTH_TOKEN/NPM_TOKEN: asi el intento directo solo puede usar OIDC.
          NPM_STAGE_TOKEN: ${{ secrets.NPM_TOKEN }}
